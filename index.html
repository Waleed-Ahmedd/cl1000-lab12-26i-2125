<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Weekly Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="planner">

    <div id="header">
      <img src="images/me.jpg" alt="My photo" class="avatar">
      <h1>Waleed Malik</h1>
      <p>Section C</p>
    </div>

    <div class="week">

      <div id="mon" class="day">
        <h3>Monday</h3>
        <div class="slot lecture">9:00 AM - Programming Lecture</div>
        <div class="slot lab">2:00 PM - ICT Lab</div>
      </div>

      <div id="tue" class="day">
        <h3>Tuesday</h3>
        <div class="slot lecture">10:00 AM - Calculus Lecture</div>
        <div class="slot lab">1:00 PM - Programming Lab</div>
      </div>

      <div id="wed" class="day">
        <h3>Wednesday</h3>
        <div class="slot lecture">11:00 AM - Physics Lecture</div>
        <div class="slot lab">3:00 PM - Physics Lab</div>
      </div>

    </div>

    <div id="goal">
      <h3>My Weekly Goal</h3>
      <p>Finish all assignments before Friday.</p>
    </div>

  </div>

</body>
</html>
